<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#0D1117"/><stop offset="45%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#7C3AED"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.25 0;0.25 0;-0.25 0" dur="10s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="r"><rect width="900" height="240" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect x="-300" width="1500" height="240" fill="url(#bg)"/>

<!-- Partículas animadas de fundo -->
<circle cx="351" cy="68" r="3" fill="#fff" opacity="0.35"><animate attributeName="cy" values="68;50;68" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="94" cy="167" r="2" fill="#fff" opacity="0.35"><animate attributeName="cy" values="167;149;167" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="539" cy="84" r="2" fill="#fff" opacity="0.35"><animate attributeName="cy" values="84;112;84" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="448" cy="47" r="2" fill="#fff" opacity="0.35"><animate attributeName="cy" values="47;75;47" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="610" cy="179" r="3" fill="#fff" opacity="0.35"><animate attributeName="cy" values="179;153;179" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="716" cy="166" r="3" fill="#fff" opacity="0.35"><animate attributeName="cy" values="166;194;166" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="833" cy="76" r="4" fill="#fff" opacity="0.35"><animate attributeName="cy" values="76;58;76" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" repeatCount="indefinite"/></circle>

<!-- GABRIEL SILVA (Topo) -->
<text x="450" y="82" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="44" font-weight="800" fill="#fff" letter-spacing="3" opacity="0">GABRIEL SILVA
<animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
<animate attributeName="y" values="102;82" dur="1.4s" fill="freeze"/></text>

<!-- Linha divisória animada -->
<rect x="350" y="96" width="200" height="3" rx="2" fill="#58A6FF"><animate attributeName="width" values="0;200;0" dur="6s" repeatCount="indefinite"/><animate attributeName="x" values="450;350;450" dur="6s" repeatCount="indefinite"/></rect>

<!-- Três Colunas Inferiores (Alinhadas Horizontalmente) -->

<!-- Coluna 1: Ciência da Computação (Esquerda) -->
<g>
<text x="180" y="142" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" font-weight="bold" fill="#93C5FD" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.4s" fill="freeze"/>
  CIÊNCIA DA COMPUTAÇÃO
</text>
<text x="180" y="165" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94A3B8" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  Bacharelado em Andamento
</text>
</g>

<!-- Coluna 2: Universidade Potiguar (Centro) -->
<g>
<text x="450" y="142" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" font-weight="bold" fill="#C084FC" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
  UNIVERSIDADE POTIGUAR
</text>
<text x="450" y="165" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94A3B8" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.7s" fill="freeze"/>
  UnP / Anima Educação
</text>
</g>

<!-- Coluna 3: Java (Direita) -->
<g>
<text x="720" y="142" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" font-weight="bold" fill="#60A5FA" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.8s" fill="freeze"/>
  JAVA &amp; TECNOLOGIA
</text>
<text x="720" y="165" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#94A3B8" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="1s" begin="0.9s" fill="freeze"/>
  Desenvolvimento Back-end
</text>
</g>

<!-- Frase de rodapé dinâmica com efeito de digitação/transição -->
<text x="450" y="208" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#38BDF8" opacity="0">
  Inteligência Artificial | MLOps | Cloud Computing
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="6s" repeatCount="indefinite"/>
</text>
<text x="450" y="208" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#38BDF8" opacity="0">
  Aprendendo, construindo e evoluindo todos os dias.
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.9;1" dur="6s" repeatCount="indefinite"/>
</text>

</g>
</svg>
